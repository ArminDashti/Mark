# Local Docker hot-reload: Go Air API (SQLite) + Vite WebUI (bind mounts).
# Usage: docker compose -f docker-compose.local.yml -p mark up -d --force-recreate
name: mark
services:
  api:
    image: golang:1.25-alpine
    restart: "no"
    working_dir: /app
    environment:
      ADDR: "0.0.0.0:8130"
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/mark.db
      JWT_SECRET: change-me-mark-jwt
      MIGRATIONS_DIR: migrations
      GIN_MODE: debug
      GOTOOLCHAIN: auto
    command:
      - sh
      - -c
      - apk add --no-cache git gcc musl-dev && go install github.com/air-verse/air@v1.61.7 && air -c .air.toml
    volumes:
      - .:/app
      - mark-gomod:/go/pkg/mod
      - mark-gotmp:/app/tmp
      - mark-data:/app/data
    ports:
      - "8180:8130"

  webui:
    image: node:22-alpine
    restart: "no"
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_BASE_PATH: "/mark/"
      VITE_HMR_CLIENT_PORT: "80"
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY: http://api:8130
    command:
      - sh
      - -c
      - rm -rf /app/node_modules/* /app/node_modules/.[!.]* 2>/dev/null; npm install && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    volumes:
      - ../mark-ui:/app
      - mark-webui-node-modules:/app/node_modules
    ports:
      - "5182:5173"
    networks:
      - default
      - pc-armin-local
    depends_on:
      - api

volumes:
  mark-gomod:
  mark-gotmp:
  mark-data:
  mark-webui-node-modules:

networks:
  pc-armin-local:
    external: true
