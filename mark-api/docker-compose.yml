name: mark

services:
  mark-api:
    image: ${IMAGE_TAG:-mark-api:latest}
    container_name: mark-api
    expose:
      - "${INTERNAL_PORT:-8130}"
    ports:
      - target: ${INTERNAL_PORT:-8130}
        published: ${PUBLISH_PORT-8230}
        protocol: tcp
    environment:
      ADDR: ":${INTERNAL_PORT:-8130}"
      DATABASE_PATH: /data/mark.db
      JWT_SECRET: ${JWT_SECRET:-3a8f27d77689be38dad547e2d589375289eff103bfa103c6}
      MIGRATIONS_DIR: /app/migrations
      DATA_DIR: /data
      GIN_MODE: release
    volumes:
      - mark-api-vol:/data
    networks:
      - app_net
    restart: "no"

networks:
    app_net:
    name: ${DOCKER_NETWORK:-mark-net}
    external: true

volumes:
  mark-api-vol:
    name: mark-api-vol
